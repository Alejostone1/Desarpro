  <meta name="theme-color" content="#05060A" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="DesarPro" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DesarPro · Tecnología que transforma tu negocio" />
  <meta property="og:description" content="Desarrollo de software profesional. Web, móvil, software a medida, IA, ciberseguridad e infraestructura para empresas que quieren crecer." />
  <meta property="og:locale" content="es_CO" />
  <meta property="og:site_name" content="DesarPro" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DesarPro · Tecnología que transforma tu negocio" />
  <meta name="twitter:description" content="Desarrollo de software profesional. Web, móvil, software a medida, IA, ciberseguridad e infraestructura para empresas que quieren crecer." />

  <title>DesarPro · Tecnología que transforma tu negocio</title>
  <!--
    Backend API base.
    - Dev local: se auto-detecta (http://localhost:3001). Deja sin definir.
    - Deploy estático con backend remoto: define VITE_API_URL antes de `vite build`
      (p. ej. VITE_API_URL="https://api.desarpro.co") y el placeholder %VITE_API_URL%
      se reemplaza aquí automáticamente.
  -->
  <meta name="desarpro:api" content="%VITE_API_URL%" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305060A'/%3E%3Cpath d='M20 24 L14 32 L20 40 M44 24 L50 32 L44 40 M36 18 L28 46' stroke='%2322D3EE' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
  <script>
    // Apply saved theme immediately to avoid FOUC
    (function() {
      try {
        var t = localStorage.getItem('desarpro:theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
    // Resolve the backend API base (used by admin.jsx and projectData.jsx).
    (function() {
      try {
        var meta = document.querySelector('meta[name="desarpro:api"]');
        var base = meta && meta.getAttribute('content');
        // "%VITE_API_URL%" es el placeholder de Vite sin reemplazar (VITE_API_URL no
        // definida en el build): se trata como si estuviera vacío (auto-detección).
        if (base && base.indexOf('%VITE_') === 0) base = '';
        if (!base) {
          var h = window.location.hostname;
          if (h === 'localhost' || h === '127.0.0.1' || h === '::1') {
            base = 'http://localhost:3001';
          }
        }
        if (base) {
          window.__DESARPRO_API_BASE = base.replace(/\/+$/, '');
        }
      } catch (e) {}
    })();
  </script>
</head>
